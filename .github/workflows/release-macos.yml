name: Release (macOS)

# Separate from release.yml (Windows) on purpose: macOS notarization is
# asynchronous and can take hours, so it must never gate the Windows release.
# This workflow builds the Apple Silicon dmg and uploads it to the same GitHub
# release (matched by tag), whenever it finishes — even long after the Windows
# build has published. It also accepts a manual run against an existing tag
# (workflow_dispatch), e.g. to (re)build or notarize macOS for a past release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build the macOS dmg for (e.g. v0.2.0-alpha)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest # arm64 since macos-14 — builds aarch64 natively
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # On a tag push this is the tag; on manual dispatch, the chosen tag.
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install Pillow pyinstaller

      # The FSLTL converter is cross-platform (Python + Pillow); Pillow decodes
      # the BC7/DX10 DDS formats that previously required Windows-only texconv.
      # build_converter.py outputs a native `fsltl_converter` (no .exe) here.
      - name: Build FSLTL converter
        run: pnpm run build:converter

      - name: Check vNAS availability and configure Git
        id: vnas-check
        env:
          VNAS_TOKEN: ${{ secrets.VNAS_REPO_TOKEN }}
        run: |
          if [ -n "$VNAS_TOKEN" ]; then
            echo "vnas_available=true" >> "$GITHUB_OUTPUT"
            git config --global url."https://${VNAS_TOKEN}@github.com/".insteadOf "https://github.com/"
            echo "vNAS repo access configured"
          else
            echo "vnas_available=false" >> "$GITHUB_OUTPUT"
            echo "Building without vNAS (no VNAS_REPO_TOKEN secret)"
            # sed -i.bak is portable across GNU (Linux/Git Bash) and BSD (macOS) sed.
            cd src-tauri
            sed -i.bak '/towercab-3d-vnas.*git.*Leftos/d' Cargo.toml
            sed -i.bak 's/vnas = \["dep:towercab-3d-vnas"\]/vnas = []/' Cargo.toml
            rm -f Cargo.toml.bak
            cargo generate-lockfile
            echo "Removed vNAS from Cargo.toml and regenerated Cargo.lock"
          fi
        shell: bash

      - name: Check signing key availability
        id: signing-check
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "signing_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "signing_available=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: Building release without updater signing (no TAURI_SIGNING_PRIVATE_KEY secret)"
            # Disable updater plugin completely (portable BSD/GNU sed via -i.bak)
            cd src-tauri
            sed -i.bak '/tauri-plugin-updater/d' Cargo.toml
            sed -i.bak '/"updater:default"/d' capabilities/desktop.json
            sed -i.bak '/Register updater plugin/,/tauri_plugin_updater/d' src/lib.rs
            rm -f Cargo.toml.bak capabilities/desktop.json.bak src/lib.rs.bak
            # Remove updater config and disable updater artifacts in tauri.conf.json
            node -e "
              const fs = require('fs');
              const config = JSON.parse(fs.readFileSync('tauri.conf.json', 'utf8'));
              delete config.plugins.updater;
              config.bundle.createUpdaterArtifacts = false;
              fs.writeFileSync('tauri.conf.json', JSON.stringify(config, null, 2));
            "
            echo "Disabled tauri-plugin-updater"
          fi
        shell: bash

      - name: Regenerate lockfile with vnas from git
        if: steps.vnas-check.outputs.vnas_available == 'true'
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: true
        run: cd src-tauri && cargo generate-lockfile

      # Resolve the release created by release.yml. We look it up by ID via the
      # list API (which includes drafts) rather than by tag: the "get release by
      # tag" API can't see a draft, so during release.yml's draft window a tag
      # lookup would 404 and tauri-action would create a duplicate release.
      # Polls because release.yml's create-release job may not have run yet.
      - name: Resolve release ID
        id: resolve-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          for attempt in $(seq 1 30); do
            id=$(gh api "repos/${{ github.repository }}/releases" \
              --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
            if [ -n "$id" ]; then
              echo "release_id=$id" >> "$GITHUB_OUTPUT"
              echo "Resolved release id $id for $TAG"
              exit 0
            fi
            echo "No release for $TAG yet (attempt $attempt/30); waiting for release.yml..."
            sleep 20
          done
          echo "ERROR: no release for $TAG after polling — did release.yml fail?" >&2
          exit 1
        shell: bash

      # tauri-action uploads the dmg to that release by ID (works whether it's
      # still a draft or already published). For the updater latest.json it
      # downloads the current asset and merges the darwin-aarch64 platform in,
      # so the Windows entry isn't clobbered.
      - name: Build Tauri app (with signing)
        if: steps.signing-check.outputs.signing_available == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_NET_GIT_FETCH_WITH_CLI: ${{ steps.vnas-check.outputs.vnas_available == 'true' }}
        with:
          releaseId: ${{ steps.resolve-release.outputs.release_id }}
          args: >-
            --target aarch64-apple-darwin
            ${{ steps.vnas-check.outputs.vnas_available == 'true' && '--features vnas' || '' }}

      - name: Build Tauri app (without signing)
        if: steps.signing-check.outputs.signing_available != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_NET_GIT_FETCH_WITH_CLI: ${{ steps.vnas-check.outputs.vnas_available == 'true' }}
        with:
          releaseId: ${{ steps.resolve-release.outputs.release_id }}
          args: >-
            --target aarch64-apple-darwin
            ${{ steps.vnas-check.outputs.vnas_available == 'true' && '--features vnas' || '' }}
