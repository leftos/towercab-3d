name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
      release_upload_url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create Release
        id: create-release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundle_type: nsis
            file_ext: exe
          # Uncomment to add macOS/Linux builds:
          # - platform: macos-latest
          #   target: x86_64-apple-darwin
          #   bundle_type: dmg
          #   file_ext: dmg
          # - platform: ubuntu-22.04
          #   target: x86_64-unknown-linux-gnu
          #   bundle_type: appimage
          #   file_ext: AppImage

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install Pillow pyinstaller

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome
        run: pnpm biome check src/

      - name: Run TypeScript type check
        run: pnpm run typecheck

      - name: Build FSLTL converter
        run: pnpm run build:converter

      - name: Check vNAS availability and configure Git
        id: vnas-check
        env:
          VNAS_TOKEN: ${{ secrets.VNAS_REPO_TOKEN }}
        run: |
          if [ -n "$VNAS_TOKEN" ]; then
            echo "vnas_available=true" >> $GITHUB_OUTPUT
            git config --global url."https://${VNAS_TOKEN}@github.com/".insteadOf "https://github.com/"
            echo "vNAS repo access configured"
          else
            echo "vnas_available=false" >> $GITHUB_OUTPUT
            echo "Building without vNAS (no VNAS_REPO_TOKEN secret)"
            # Remove vnas from Cargo.toml and regenerate lockfile
            cd src-tauri
            sed -i '/towercab-3d-vnas.*git.*Leftos/d' Cargo.toml
            sed -i 's/vnas = \["dep:towercab-3d-vnas"\]/vnas = []/' Cargo.toml
            cargo generate-lockfile
            echo "Removed vNAS from Cargo.toml and regenerated Cargo.lock"
          fi
        shell: bash

      - name: Check signing key availability
        id: signing-check
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "signing_available=true" >> $GITHUB_OUTPUT
          else
            echo "signing_available=false" >> $GITHUB_OUTPUT
            echo "WARNING: Building release without signing (no TAURI_SIGNING_PRIVATE_KEY secret)"
            # Disable updater plugin completely
            cd src-tauri
            sed -i '/tauri-plugin-updater/d' Cargo.toml
            sed -i '/"updater:default"/d' capabilities/desktop.json
            # Remove updater code block from lib.rs (comment + cfg + plugin line)
            sed -i '/Register updater plugin/,/tauri_plugin_updater/d' src/lib.rs
            # Remove updater config and disable updater artifacts in tauri.conf.json
            node -e "
              const fs = require('fs');
              const config = JSON.parse(fs.readFileSync('tauri.conf.json', 'utf8'));
              delete config.plugins.updater;
              config.bundle.createUpdaterArtifacts = false;
              fs.writeFileSync('tauri.conf.json', JSON.stringify(config, null, 2));
            "
            echo "Disabled tauri-plugin-updater"
          fi
        shell: bash

      - name: Regenerate lockfile with vnas from git
        if: steps.vnas-check.outputs.vnas_available == 'true'
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: true
        run: cd src-tauri && cargo generate-lockfile

      - name: Build Tauri app (with signing)
        if: steps.signing-check.outputs.signing_available == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_NET_GIT_FETCH_WITH_CLI: ${{ steps.vnas-check.outputs.vnas_available == 'true' }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }} ${{ steps.vnas-check.outputs.vnas_available == 'true' && '--features vnas' || '' }}

      - name: Build Tauri app (without signing)
        if: steps.signing-check.outputs.signing_available != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_NET_GIT_FETCH_WITH_CLI: ${{ steps.vnas-check.outputs.vnas_available == 'true' }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target ${{ matrix.target }} ${{ steps.vnas-check.outputs.vnas_available == 'true' && '--features vnas' || '' }}

  publish-release:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
