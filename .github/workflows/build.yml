name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      fast:
        description: 'Skip NSIS compression (much faster, larger installer; non-shippable)'
        type: boolean
        default: true

# Cancel in-progress PR builds when a new push lands on the same PR.
# Main-branch builds run to completion so we don't lose installer artifacts.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast Linux job: lint + typecheck. Fails in ~1 minute, blocking the slow
  # Windows build below from running when there's a trivial frontend error.
  quick-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome
        run: pnpm biome check src/ --error-on-warnings

      - name: Run TypeScript type check
        run: pnpm run typecheck

  build:
    needs: quick-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          # Uncomment to add macOS/Linux builds:
          # - platform: macos-latest
          #   target: x86_64-apple-darwin
          # - platform: ubuntu-22.04
          #   target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install Pillow pyinstaller

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Required before clippy: tauri::context! validates bundle.resources at
      # compile time, and frontendDist must exist for include_dir!.
      - name: Build FSLTL converter
        run: pnpm run build:converter

      - name: Build frontend
        run: pnpm run vite:build

      - name: Check vNAS availability and configure Git
        id: vnas-check
        env:
          VNAS_TOKEN: ${{ secrets.VNAS_REPO_TOKEN }}
        run: |
          if [ -n "$VNAS_TOKEN" ]; then
            echo "vnas_available=true" >> $GITHUB_OUTPUT
            git config --global url."https://${VNAS_TOKEN}@github.com/".insteadOf "https://github.com/"
            echo "vNAS repo access configured"
          else
            echo "vnas_available=false" >> $GITHUB_OUTPUT
            echo "Building without vNAS (no VNAS_REPO_TOKEN secret)"
            # Remove vnas from Cargo.toml and regenerate lockfile
            # (Don't use static Cargo.lock.public - it would overwrite dependabot updates)
            cd src-tauri
            sed -i '/towercab-3d-vnas.*git.*Leftos/d' Cargo.toml
            sed -i 's/vnas = \["dep:towercab-3d-vnas"\]/vnas = []/' Cargo.toml
            cargo generate-lockfile
            echo "Removed vNAS from Cargo.toml and regenerated Cargo.lock"
          fi
        shell: bash

      - name: Regenerate lockfile with vnas from git
        if: steps.vnas-check.outputs.vnas_available == 'true'
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: true
        run: cd src-tauri && cargo generate-lockfile

      # Cache restore comes AFTER lockfile manipulation so the cache key (which
      # hashes Cargo.lock) matches what the build will actually compile. The
      # explicit `key` suffix splits the cache between vnas / no-vnas runs.
      - name: Cache Rust dependencies and target/
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: vnas-${{ steps.vnas-check.outputs.vnas_available }}
          cache-on-failure: true

      - name: Run Clippy
        working-directory: src-tauri
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: ${{ steps.vnas-check.outputs.vnas_available == 'true' }}
        run: >-
          cargo clippy --release --all-targets
          ${{ steps.vnas-check.outputs.vnas_available == 'true' && '--features vnas' || '' }}
          -- -D warnings

      # ---- Below: only on push to main or manual dispatch, not on PRs ----
      # PRs get clippy as their gate; the full installer build is reserved for
      # main-branch pushes, manual dispatch, and tag pushes via release.yml.

      - name: Check signing key availability
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: signing-check
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "signing_available=true" >> $GITHUB_OUTPUT
          else
            echo "signing_available=false" >> $GITHUB_OUTPUT
            echo "Building without updater signing (no TAURI_SIGNING_PRIVATE_KEY secret)"
            # Disable updater plugin completely
            cd src-tauri
            sed -i '/tauri-plugin-updater/d' Cargo.toml
            sed -i '/"updater:default"/d' capabilities/desktop.json
            # Remove updater code block from lib.rs (comment + cfg + plugin line)
            sed -i '/Register updater plugin/,/tauri_plugin_updater/d' src/lib.rs
            # Remove updater config and disable updater artifacts in tauri.conf.json
            node -e "
              const fs = require('fs');
              const config = JSON.parse(fs.readFileSync('tauri.conf.json', 'utf8'));
              delete config.plugins.updater;
              config.bundle.createUpdaterArtifacts = false;
              fs.writeFileSync('tauri.conf.json', JSON.stringify(config, null, 2));
            "
            echo "Disabled tauri-plugin-updater"
          fi
        shell: bash

      - name: Build Tauri app (with signing)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.signing-check.outputs.signing_available == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_NET_GIT_FETCH_WITH_CLI: ${{ steps.vnas-check.outputs.vnas_available == 'true' }}
        with:
          args: >-
            --target ${{ matrix.target }}
            ${{ steps.vnas-check.outputs.vnas_available == 'true' && '--features vnas' || '' }}
            ${{ inputs.fast && '--config src-tauri/tauri.fast.conf.json' || '' }}

      - name: Build Tauri app (without signing)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.signing-check.outputs.signing_available != 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_NET_GIT_FETCH_WITH_CLI: ${{ steps.vnas-check.outputs.vnas_available == 'true' }}
        with:
          args: >-
            --target ${{ matrix.target }}
            ${{ steps.vnas-check.outputs.vnas_available == 'true' && '--features vnas' || '' }}
            ${{ inputs.fast && '--config src-tauri/tauri.fast.conf.json' || '' }}

      - name: Upload artifacts (Windows)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
